[project]
name = "gpt-journey"
version = "2.0.0"
description = "An illustrated, branching text adventure narrated by Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gpt-journey = "journey.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["journey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
